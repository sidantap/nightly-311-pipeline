name: nightly pipeline

on:
  schedule:
    - cron: "17 7 * * *"   # 07:17 UTC, about 3 a.m. in Cincinnati
  workflow_dispatch:
  push:
    branches: [claude/nightly-pipeline]

permissions:
  contents: write   # store the warehouse as a release asset
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Restore warehouse from last run
        run: |
          mkdir -p warehouse
          if gh release download warehouse -p warehouse.duckdb.gz -D warehouse; then
            gunzip -f warehouse/warehouse.duckdb.gz
            echo "restored $(du -h warehouse/warehouse.duckdb | cut -f1)"
          else
            echo "no saved warehouse yet, this run backfills from scratch"
          fi

      - name: Run pipeline
        env:
          NOAA_TOKEN: ${{ secrets.NOAA_TOKEN }}
          BACKFILL_DAYS: "30"        # first run only: a month of 311 and weather
          NHTSA_BACKFILL_DAYS: "7"   # first run only: a week of complaints to classify
        run: python -m pipeline.run

      - name: Save warehouse for the next run
        if: success() || failure()
        run: |
          gzip -kf warehouse/warehouse.duckdb
          gh release view warehouse >/dev/null 2>&1 || \
            gh release create warehouse --title "Warehouse snapshot" \
              --notes "DuckDB warehouse, replaced after every nightly run."
          gh release upload warehouse warehouse/warehouse.duckdb.gz --clobber

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
